# .coderabbit.yaml
# CodeRabbit AI Code Review Configuration for SkyRecompiled
# 100% Free for Open-Source Public Repositories

language: "en-US"
early_access: false

reviews:
  # 'assertive' is CodeRabbit's standard, thorough review profile (catches bugs, security, edge cases)
  profile: "assertive"
  request_changes_workflow: false
  high_level_summary: true
  auto_review:
    enabled: true
    drafts: false
  
  # Project-specific domain constraints appended to CodeRabbit's default review engine
  prompt_instructions: |
    Domain Invariants (Unique to SkyRecompiled):
    1. Clean-Room Discipline: Under NO circumstances allow proprietary Nintendo/Chunsoft ROM binaries (.nds), extracted soundfonts/sprites, or raw script dumps to be committed.
    2. Save System: Must adhere to 131072 bytes (128KB) EEPROM format with a 4-page live validation cap.
    3. Architecture: Must maintain BIOS-free direct boot and strict C++20 standard compliance.

chat:
  auto_reply: true
