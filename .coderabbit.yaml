# .coderabbit.yaml
# CodeRabbit AI Code Review Configuration for SkyRecompiled
# 100% Free for Open-Source Public Repositories

language: "en-US"
early_access: false

reviews:
  profile: "chill"
  request_changes_workflow: false
  high_level_summary: true
  auto_review:
    enabled: true
    drafts: false
  
  # Project-specific review instructions
  prompt_instructions: |
    Strict Project Invariants:
    1. Clean-Room Discipline: STRICT ZERO-TOLERANCE for proprietary Nintendo/Chunsoft ROM binaries (.nds), extracted binary assets (sprites/soundfonts/scripts), or raw decompiled leaks.
    2. Save Safety: Strict EEPROM format (131072 bytes / 128KB), 4-page live validation cap, non-volatile state integrity.
    3. Modern Architecture: Strict C++20, zero undefined behavior, multi-platform (macOS/Linux/Windows), BIOS-free direct boot.
    4. Anti-Slop: Flag unnecessary wrapper boilerplate, unreferenced variables, hallucinated APIs, and placeholder comments.

chat:
  auto_reply: true
