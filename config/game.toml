# ─────────────────────────────────────────────────────────────────────────────
# SkyRecompiled -- Runtime Configuration (Pokemon Mystery Dungeon: Explorers of Sky USA)
# ─────────────────────────────────────────────────────────────────────────────

[game]
# Clean No-Intro USA ROM (C2SE, 134,217,728 bytes)
sha1 = "5fa96ca8d8dd6405d6cd2bad73ed68bc73a9d152"

[system]
# BIOS-free direct boot: uses BSD-2-Clause FreeBIOS + synthesized firmware
# so players only supply their legally owned Explorers of Sky .nds ROM.
boot = "direct"
freebios = true
generated_firmware = true
startup_mode = "automatic"
player_name = "Explorer"

[cartridge]
# CRITICAL: Explorers of Sky uses 128 KiB FRAM/EEPROM (3-byte SPI 0x02/0x03).
# Do NOT set save_type = "flash" or saves will trigger CardBackupError!
save_type = "eeprom"
save_size = 131072

[display]
screen_layout = "stacked"
fullscreen = "off"
internal_resolution = 2
frame_interpolation = "off"

[network]
enabled = false

[local_wireless]
enabled = false
