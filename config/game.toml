# ─────────────────────────────────────────────────────────────────────────────
# SkyRecompiled -- Runtime Configuration (Pokemon Mystery Dungeon: Explorers of Sky)
# ─────────────────────────────────────────────────────────────────────────────

# Launchers validate USA and Europe ROMs; the runner matches compiled game banks by SHA-1.

[system]
# BIOS-free direct boot: uses BSD-2-Clause FreeBIOS + synthesized firmware
# so players only supply their legally owned Explorers of Sky .nds ROM.
boot = "direct"
freebios = true
generated_firmware = true
startup_mode = "automatic"
player_name = "Explorer"

[cartridge]
# CRITICAL: Explorers of Sky uses 128 KiB FRAM/EEPROM (3-byte SPI 0x02/0x03).
# Do NOT set save_type = "flash" or saves will trigger CardBackupError!
save_type = "eeprom"
save_size = 131072

[display]
screen_layout = "stacked"
fullscreen = "off"
internal_resolution = 2
frame_interpolation = "off"
# Widescreen is enabled by the frontend only for verified PMD Sky ROMs, so
# this shared config never applies another title's adaptive settings.

[network]
enabled = false

[local_wireless]
enabled = false
